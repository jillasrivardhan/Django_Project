<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login Page</title>
</head>
<style>
       *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:seoulhangang, sans-serif;
}

body{
    height:100vh;
    background:#f4f6fb;
}

.container{
    display:flex;
    height:100vh;
}

/* LEFT SIDE */

.left-side{
    width:50%;
    background:
        linear-gradient(rgba(18,38,63,.65),rgba(18,38,63,.65)),
        url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay{
    width:80%;
    color:white;
}

.overlay h1{
    font-size:55px;
    margin-bottom:20px;
}

.overlay p{
    font-size:22px;
    line-height:1.7;
}

/* RIGHT SIDE */

.right-side{
    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f8f9fd;
}

/* FORM */

form{
    width:420px;
    background:white;
    padding:45px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

form h2{
    text-align:center;
    margin-bottom:35px;
    color:#233876;
    font-size:36px;
}

input{
    width:100%;
    height:50px;
    margin-top:8px;
    margin-bottom:25px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
    outline:none;
    transition:.3s;
}

input:focus{
    border-color:#6C63FF;
    box-shadow:0 0 8px rgba(108,99,255,.2);
}

button{
    width:100%;
    height:52px;
    border:none;
    border-radius:8px;
    background:#6C63FF;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#5448ff;
}

.msg{
    text-align:center;
    margin-top:18px;
    color:#d9534f;
}

/* MOBILE */

@media(max-width:900px){

.container{
    flex-direction:column;
}

.left-side{
    width:100%;
    height:35vh;
}

.right-side{
    width:100%;
    height:65vh;
}

.overlay h1{
    font-size:38px;
}

.overlay p{
    font-size:18px;
}

form{
    width:90%;
}

}

    </style>
<body>
   <center>
      <!-- <form method="POST" action="">
         {% csrf_token %}
         email: <input type="email" id="email" name="email" required><br><br>
         password:<input type="password" id="password" name="password" required><br><br>
         <button type="submit">Login</button>
         <p style="color: brown;">{{msg}}</p>
      </form> -->
      <div class="container">

    <div class="left-side">
        <div class="overlay">
            <h1>Welcome Back</h1>
            <p>Manage your account securely and access your dashboard anytime.</p>
        </div>
    </div>

    <div class="right-side">

        <form method="POST">
            {% csrf_token %}

            <h2>Log In</h2>

            email:
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            password:
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>

            <p class="msg">{{msg}}</p>

        </form>

    </div>

</div>
   </center>
</body>
</html>
