<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Register</title>
</head>
<style>
   *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    height:100vh;
    background:#f5f7fb;
}

.container{
    display:flex;
    height:100vh;
}

/* LEFT SIDE */

.left-side{

    width:50%;

    background:
    linear-gradient(rgba(20,35,65,.65),rgba(20,35,65,.65)),
    url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay{

    width:80%;
    color:white;

}

.overlay h1{

    font-size:60px;
    margin-bottom:20px;

}

.overlay p{

    font-size:22px;
    line-height:1.8;

}

/* RIGHT SIDE */

.right-side{

    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f8f9fd;

}

/* FORM */

form{

    width:430px;

    background:white;

    padding:45px;

    border-radius:18px;

    box-shadow:0 15px 35px rgba(0,0,0,.08);

}

form h2{

    text-align:center;

    color:#24376a;

    margin-bottom:35px;

    font-size:34px;

}

input{

    width:100%;

    height:50px;

    margin-top:8px;

    margin-bottom:22px;

    padding:15px;

    border:1px solid #ddd;

    border-radius:8px;

    outline:none;

    font-size:16px;

    transition:.3s;

}

input:focus{

    border-color:#6C63FF;

    box-shadow:0 0 8px rgba(108,99,255,.25);

}

button{

    width:100%;

    height:52px;

    background:#6C63FF;

    color:white;

    border:none;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#4f46e5;

}

.msg{

    text-align:center;

    margin-top:18px;

    color:green;

    font-weight:600;

}

.login-link{

    margin-top:25px;

    text-align:center;

    color:#666;

}

.login-link a{

    text-decoration:none;

    color:#6C63FF;

    font-weight:bold;

}

.login-link a:hover{

    text-decoration:underline;

}

/* Responsive */

@media(max-width:900px){

.container{

    flex-direction:column;

}

.left-side{

    width:100%;
    height:35vh;

}

.right-side{

    width:100%;
    height:65vh;

}

.overlay h1{

    font-size:40px;

}

.overlay p{

    font-size:18px;

}

form{

    width:90%;

}

}
</style>
<body>
   <!-- <center>
      <form method="POST">
         {% csrf_token %}
         <h2>Register</h2>
         name:<input type="text" name="name" placeholder="Name" required><br><br>
         email:<input type="email" name="email" placeholder="Email" required><br><br>
         password:<input type="password" name="password" placeholder="Password" required><br><br>
         <button type="submit">Register</button>
         <p style="color:green;">{{ msg }}</p>

      </form>
   </center> -->

<div class="container">

    <div class="left-side">

        <div class="overlay">
            <h1>Join Us</h1>

            <p>
                Create your account and enjoy a secure, fast, and seamless
                experience. It only takes a minute to get started.
            </p>
        </div>

    </div>

    <div class="right-side">

        <form method="POST">

            {% csrf_token %}

            <h2>Create Account</h2>

            name:
            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            email:
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            password:
            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >

            <button type="submit">
                Register
            </button>

            <p class="msg">{{ msg }}</p>

            <div class="login-link">
                Already have an account?
                <a href="{% url 'Login' %}">Login</a>
            </div>

        </form>

    </div>

</div>
</body>
</html>
